[project]
name = "codescale-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["analyzer/sample.py"]

[tool.ruff.lint]
ignore = [
    "SIM102",  # style hint, ignored on purpose
    "BLE001",  # engine entry points must catch everything and return JSON errors
    "TRY004",  # ValueError is the documented error type for bad requests
]

[tool.ruff.lint.per-file-ignores]
# This demo file is intentionally slow so the analyzer has something to flag.
"analyzer/demo_phase2.py" = ["FURB192"]